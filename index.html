<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>drylu123 — App Developer</title>
<meta name="description" content="drylu123's app developer website. Contact: drylu123@gmail.com" />
<style>
  :root{
    --bg:#f0f2f5;
    --card:#fbfbfc;
    --text:#1b222c;
    --muted:#6b7280;
    --line:#d8dde5;
    --accent:#2b6cf6;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    color:var(--text);
    background:
      linear-gradient(#dfe4ec 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, #dfe4ec 1px, transparent 1px) 0 0 / 40px 100%,
      linear-gradient(160deg, #f7f8fa 0%, #e8ecf2 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:600px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:48px 44px;
    box-shadow:0 1px 2px rgba(27,34,44,.04), 0 20px 50px -20px rgba(27,34,44,.18);
  }

  /* 顶部小标签 */
  .tag{
    display:inline-block;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    background:rgba(43,108,246,.07);
    border:1px solid rgba(43,108,246,.2);
    border-radius:999px;
    padding:5px 13px;
    margin-bottom:26px;
  }

  h1{
    margin:0 0 18px;
    font-size:clamp(28px,5.5vw,40px);
    line-height:1.15;
    letter-spacing:-.025em;
    font-weight:750;
  }

  h1 span{color:var(--accent)}

  .welcome{
    margin:0 0 34px;
    font-size:17px;
    color:var(--muted);
  }

  /* 分割线 */
  .divider{
    height:1px;
    background:var(--line);
    margin:0 0 32px;
  }

  .label{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }

  .email{
    display:inline-block;
    font-size:clamp(17px,3.4vw,21px);
    font-weight:650;
    color:var(--text);
    text-decoration:none;
    padding-bottom:3px;
    border-bottom:2px solid var(--accent);
    transition:color .2s ease;
    word-break:break-all;
  }

  .email:hover{color:var(--accent)}

  footer{
    margin-top:38px;
    padding-top:22px;
    border-top:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
  }

  @media (max-width:520px){
    .card{padding:36px 26px}
  }
</style>
</head>
<body>

  <main class="card">

    <div class="tag">App Developer</div>

    <h1>drylu123's <span>App Developer</span> Website</h1>

    <p class="welcome">Welcome to my developer website.</p>

    <div class="divider"></div>

    <div class="label">Contact &amp; Support</div>
    <a class="email" href="mailto:drylu123@gmail.com">drylu123@gmail.com</a>

    <footer>
      <span>© 2025 drylu123</span>
      <span>Contact · Support</span>
    </footer>

  </main>

</body>
</html>
